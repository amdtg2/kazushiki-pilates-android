name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build test APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KazushikiPilates.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KazushikiPilates.apk \
            --title "Latest test build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Download KazushikiPilates.apk on your Android phone and open it to install." \
            --prerelease
