name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue assembleDebug 2>&1 | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue testDebugUnitTest 2>&1 | tee test.log

      - name: Save a readable error report
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run ${{ github.run_number }} for ${{ github.sha }}"
            echo "== Compiler errors =="
            grep -hE "^e: |error:|What went wrong|Could not|> Task .*FAILED" build.log test.log 2>/dev/null | head -400 || true
            echo "== Failed tests =="
            grep -hE "FAILED|AssertionError|Exception" test.log 2>/dev/null | head -200 || true
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] && grep -A6 "<failure" "$f" | head -60
            done
            echo "== Tail of build log =="
            tail -80 build.log 2>/dev/null || true
          } > ci-report.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-results || true
          git switch --orphan ci-report-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add ci-report.txt
          git commit -m "CI report for ${{ github.sha }}"
          git push -f origin HEAD:ci-results

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KazushikiPilates.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KazushikiPilates.apk \
            --title "Latest test build (#${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Download KazushikiPilates.apk on your Android phone and open it to install." \
            --prerelease
